# sbxloop budget preset for a large existing repository (#253).
#
# The defaults `sbxloop init` writes are sized for a small greenfield project.
# On a ~10 kLOC / ~1000-test repo (sbxloop itself is the reference case) one
# verify pass is ~150 s of fork/exec-heavy pytest, and up to 20 tasks x
# 3 attempts x verify presses on a 2 h wall clock; 40 tool calls is thin for
# orienting in a multi-package tree before touching anything.
#
# Copy the sections you want into your sbxloop.toml (or `[tool.sbxloop]` in
# pyproject.toml). Nothing here changes the sandbox's CPU/memory: sbxloop
# passes no sizing flags to `sbx create` — the microVM is whatever size sbx
# gives every sandbox — so the [limits] section is how memory pressure is
# made visible instead of surfacing as a confusing test failure.

[budgets]
max_revisions_per_task = 2
max_replans_per_task = 1
max_tasks = 20
max_wall_clock_s = 14400.0        # 4 h: room for verify-heavy revision cycles
per_job_timeout_s = 1800.0        # each verify command still gets the full 30 min
max_tool_calls_per_phase = 80     # two packages + tests to read before editing

[limits]
disk_warn = 85.0
disk_abort = 95.0
mem_warn = 90.0
# Off by default in sbxloop because a parallel test run spikes MemAvailable
# for a heartbeat; turn it on when an in-VM OOM has been showing up as an
# inexplicable test failure — the task then fails with "sandbox memory
# exhausted" naming the threshold.
mem_abort = 97.0
