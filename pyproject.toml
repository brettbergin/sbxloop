[tool.uv]
# uv supplies the interpreter. Binding to a distro Python made the suite's
# behaviour depend on how that Python was built (GNU readline exports
# COLUMNS/LINES to every child process; libedit does not) and the CI matrix
# on what ubuntu-latest happens to ship.
python-preference = "only-managed"

[tool.uv.workspace]
members = ["packages/sbxloop", "packages/sbxloop-worker"]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "bandit>=1.8",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.4.1",
    "types-PyYAML>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/sbxloop/src", "packages/sbxloop-worker/src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "C4",     # comprehensions
    "RET",    # return
    "RUF",    # ruff-specific
    "PTH",    # pathlib
    "T20",    # no stray prints in library code
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"packages/*/tests/**" = ["T20"]
# Repository tooling reports on stdout by design.
"scripts/**" = ["T20"]
# The worker communicates over stdout by design.
"packages/sbxloop-worker/src/sbxloop_worker/**" = ["T20"]

[tool.bandit]
# B101: asserts here are mypy-strict type-narrowing invariants on internal
#       state, not input validation; nothing runs under python -O.
# B404: informational "subprocess imported" — spawning sbx/worker processes
#       is this tool's core function; each call site carries its own vetted
#       `# nosec B603` (fixed argv lists, never shell=True).
skips = ["B101", "B404"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["packages/sbxloop/src", "packages/sbxloop-worker/src"]
files = ["packages/sbxloop/src", "packages/sbxloop-worker/src"]
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
# Optional extras: the host SDK ([copilot]) and the daemon's chat bridges
# ([discord], [slack]) are deferred imports that resolve only when installed.
module = [
    "copilot",
    "copilot.*",
    "claude_agent_sdk",
    "claude_agent_sdk.*",
    "discord",
    "discord.*",
    "slack_sdk",
    "slack_sdk.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/sbxloop-worker/tests"]
markers = [
    # Auto-applied to every test on the fake sbx (root conftest.py); also set
    # by hand on real-git (lfs, submodules) and packaging tests. The commit
    # gate is `-m "not slow"`; CI runs both halves.
    "slow: process-bound tests (fake sbx, real workers, real git, builds)",
]
# Coverage is CI's job (`make test-cov`): tracing costs ~15% wall on full
# runs, and --cov-fail-under in addopts makes every partial run (single
# file, -k, --pdb) fail its gate.
addopts = [
    "-ra",
    # Engine tests are subprocess-bound (fake sbx + real workers): they spend
    # their time blocked in fork/exec and pipe reads, so they want every
    # logical core — `auto` is os.cpu_count() (no psutil here). Measured on a
    # 8c/16t Mac: the pipeline tests run 20% faster at 16 workers than at 8,
    # and 4 vs 8 is a wash, so do not pass a smaller -n by hand. worksteal
    # rebalances the long tail of multi-second engine tests. Pass -n0 for a
    # serial run (-s, --pdb).
    "-n=auto",
    "--dist=worksteal",
]

[tool.coverage.run]
branch = true
omit = [
    # Exercised only by the real-sbx e2e workflow: requires the Copilot SDK
    # runtime and a Copilot subscription.
    "*/sbxloop_worker/backends/copilot.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
