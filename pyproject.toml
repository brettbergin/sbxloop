[tool.uv.workspace]
members = ["packages/sbxloop", "packages/sbxloop-worker"]

[dependency-groups]
dev = [
    "ruff>=0.12",
    "mypy>=1.16",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "bandit>=1.8",
    "mdformat>=0.7.22",
    "mdformat-gfm>=0.4.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages/sbxloop/src", "packages/sbxloop-worker/src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "C4",     # comprehensions
    "RET",    # return
    "RUF",    # ruff-specific
    "PTH",    # pathlib
    "T20",    # no stray prints in library code
]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]
"packages/*/tests/**" = ["T20"]
# The worker communicates over stdout by design.
"packages/sbxloop-worker/src/sbxloop_worker/**" = ["T20"]

[tool.bandit]
# B101: asserts here are mypy-strict type-narrowing invariants on internal
#       state, not input validation; nothing runs under python -O.
# B404: informational "subprocess imported" — spawning sbx/worker processes
#       is this tool's core function; each call site carries its own vetted
#       `# nosec B603` (fixed argv lists, never shell=True).
skips = ["B101", "B404"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = ["packages/sbxloop/src", "packages/sbxloop-worker/src"]
files = ["packages/sbxloop/src", "packages/sbxloop-worker/src"]
explicit_package_bases = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[[tool.mypy.overrides]]
module = ["copilot", "copilot.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "packages/sbxloop-worker/tests"]
markers = ["slow: long-running packaging/build tests"]
addopts = [
    "--cov=sbxloop",
    "--cov=sbxloop_worker",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
    "-ra",
    # Engine tests are subprocess-bound (fake sbx + real workers), so the
    # suite parallelizes ~linearly. worksteal rebalances the long tail of
    # multi-second engine tests. Pass -n0 for a serial run (-s, --pdb).
    "-n=auto",
    "--dist=worksteal",
]

[tool.coverage.run]
branch = true
omit = [
    # Exercised only by the real-sbx e2e workflow: requires the Copilot SDK
    # runtime and a Copilot subscription.
    "*/sbxloop_worker/backends/copilot.py",
]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
