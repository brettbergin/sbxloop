[project]
name = "sbxloop"
dynamic = ["version"]  # derived from git tags by hatch-vcs (see [tool.hatch.version])
description = "Agentic loop orchestration on Docker Sandboxes (sbx) with isolated credential domains"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Brett Bergin" }]
keywords = ["agents", "sandbox", "docker", "copilot", "orchestration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    # Unpinned here because the version is dynamic; the build hook
    # (hatch_build.py) adds the exact lockstep pin `sbxloop-worker==X.Y.Z`
    # to the wheel metadata at build time.
    "sbxloop-worker",
    "gitpython>=3.1.59",
    "structlog>=24.1",
    # Optional host error reporting is dormant until the operator supplies a DSN.
    "sentry-sdk>=2.68.0,<3",
    # `.rubocop.yml` / other YAML project files the verify lint reads (#628).
    "pyyaml>=6.0",
    # `requires-python` is a PEP 440 specifier; the toolchain series a run
    # provisions is chosen against it (#627).
    "packaging>=26.3",
    "textual>=8.2",
    # The overview's distributions and trends (`tui/widgets/chart.py`).
    # Bands cover every "what share" question and cover it better; these
    # are the plots that need a scale. Pure Python, no transitive deps.
    "textual-plotext>=1.0.1",
    # Round-trip TOML for the console's config editor: setting one key must
    # keep every comment and every other line of the operator's file
    # (`configedit/toml.py`); `tomllib` reads but cannot write.
    "tomlkit>=0.13",
    # The data layer. One WAL-mode SQLite file holds every table; SQLAlchemy
    # owns the mapping and Alembic owns the upgrade path, applied on open so
    # an unattended daemon still migrates itself (#539).
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Host-side SDK access for `sbxloop list-models` (agent sessions get the SDK
# inside the sandbox via sbxloop-worker[copilot]; runs never need this extra).
copilot = ["github-copilot-sdk>=1.0.8"]
# Host-side model listing; agent sessions install the worker's matching extra.
codex = ["openai-codex==0.147.0"]
# `sbxloop daemon`'s chat bridge (chronology + steering), one extra per
# backend; the daemon runs without either when no [chat] backend is set.
discord = ["discord.py>=2.3"]
# Socket Mode needs aiohttp, which slack_sdk leaves optional.
slack = ["slack-sdk>=3.33", "aiohttp>=3.9"]
# Mattermost's API is plain REST plus a websocket, so the bridge speaks it
# directly (see daemon/mattermost.py) rather than through a driver.
mattermost = ["aiohttp>=3.9"]

[project.scripts]
sbxloop = "sbxloop.cli.app:main"

[project.urls]
Homepage = "https://github.com/brettbergin/sbxloop"
Repository = "https://github.com/brettbergin/sbxloop"
Issues = "https://github.com/brettbergin/sbxloop/issues"

[tool.uv.sources]
sbxloop-worker = { workspace = true }

[build-system]
requires = ["hatchling>=1.27", "hatch-vcs"]
build-backend = "hatchling.build"

# Both workspace packages version from the same repo-root git tag, keeping the
# lockstep invariant by construction. `fallback_root` lets a wheel built from
# an extracted sdist (no git) pick the version up from the sdist's PKG-INFO.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", fallback_root = ".", local_scheme = "no-local-version", fallback_version = "0.0.0" }

# Write the resolved version into the package so `sbxloop.__version__` and
# `sbxloop --version` report it at runtime.
[tool.hatch.build.hooks.vcs]
version-file = "src/sbxloop/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sbxloop"]
artifacts = [
  "src/sbxloop/_vendor/*.whl",
  "src/sbxloop/data/*.example",
  "src/sbxloop/data/presets/*.toml",
  "src/sbxloop/data/home/*",
  # Alembic reads this template off disk when a developer writes a revision;
  # hatch ships the .py files on its own but not a .mako.
  "src/sbxloop/db/migrations/script.py.mako",
]

[tool.hatch.build.targets.sdist]
artifacts = [
  "src/sbxloop/_vendor/*.whl",
  "src/sbxloop/data/*.example",
  "src/sbxloop/data/presets/*.toml",
  "src/sbxloop/data/home/*",
  # Alembic reads this template off disk when a developer writes a revision;
  # hatch ships the .py files on its own but not a .mako.
  "src/sbxloop/db/migrations/script.py.mako",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
