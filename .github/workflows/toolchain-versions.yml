name: Toolchain version drift

# The toolchain versions in sbxloop.toolchains are pinned for reproducibility,
# which means they go stale silently: a stale pin does not fail a test, it just
# hands the agent an old compiler. This job is the alert that nothing else
# provides. Advisory only — it never gates a merge.
on:
  schedule:
    # Mondays, 07:00 UTC.
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages

      - name: Compare pinned versions against upstream
        id: check
        run: |
          set +e
          uv run python scripts/check_toolchain_versions.py > drift.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat drift.txt
        continue-on-error: true

      - name: Open or update the drift issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Toolchain version pins are behind upstream"
          body="$(printf 'Automated check from `.github/workflows/toolchain-versions.yml`.\n\nBump each constant in `packages/sbxloop/src/sbxloop/toolchains.py` **together with its digest** — a version bumped without its digest fails the install checksum and silently drops the toolchain.\n\n```\n%s\n```\n' "$(cat drift.txt)")"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label enhancement
          fi
