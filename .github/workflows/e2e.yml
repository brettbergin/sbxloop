name: E2E (real sbx)

# Manually dispatched: installs real Docker Sandboxes on the runner and runs
# sbxloop against it. Requires repository secrets:
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN  - for `sbx login`
# and, to run the full smoke loop (skipped when absent):
#   E2E_COPILOT_GITHUB_TOKEN  - fine-grained PAT w/ "Copilot Requests"
#   E2E_GH_TOKEN              - fine-grained PAT w/ issues:write etc.

on:
  workflow_dispatch:
    inputs:
      smoke_outcome:
        description: Outcome for the smoke run
        default: "Create a file named hello.txt containing exactly 'hello sbxloop'"
        required: false

env:
  SBX_INSTALL_DIR: /home/runner/.docker/sbx
  # state_dir defaults to ~/.sbxloop; the steps below read the run's
  # state.db / runs/ from the checkout, so pin state to the workspace.
  SBXLOOP_STATE_DIR: .sbxloop

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages

      - name: Enable KVM and user namespaces
        run: |
          sudo chmod 666 /dev/kvm
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install sbx
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://api.github.com/repos/docker/sbx-releases/releases/latest \
            | uv run --no-project python -c "import json,sys; assets=[a['browser_download_url'] for a in json.load(sys.stdin)['assets'] if 'linux' in a['name'] and ('amd64' in a['name'] or 'x86_64' in a['name']) and a['name'].endswith('.tar.gz')]; print(assets[0])")
          echo "downloading $url"
          curl -fsSL -o /tmp/sbx.tar.gz "$url"
          mkdir -p /tmp/docker-sbx && tar -xzf /tmp/sbx.tar.gz -C /tmp/docker-sbx --strip-components=1
          sudo PREFIX="$SBX_INSTALL_DIR" /tmp/docker-sbx/install.sh
          echo "$SBX_INSTALL_DIR/bin" >> "$GITHUB_PATH"

      - name: Start keyring (Secret Service for sbx credential storage)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q gnome-keyring dbus-x11
          echo 'DBUS_SESSION_BUS_ADDRESS='$(dbus-daemon --session --fork --print-address) >> "$GITHUB_ENV"

      - name: sbx login
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo -n "" | gnome-keyring-daemon --unlock --components=secrets || true
          printf '%s' "$DOCKERHUB_TOKEN" | sbx --app-name sbxloop-e2e login --username "$DOCKERHUB_USERNAME" --password-stdin
          sbx --app-name sbxloop-e2e version

      - name: sbx policy init balanced
        run: sbx --app-name sbxloop-e2e policy init balanced

      - name: sbxloop doctor
        env:
          SBXLOOP_APP_NAME: sbxloop-e2e
          COPILOT_GITHUB_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
        # Doctor exits 1 when tokens are missing; report but don't hide it.
        run: uv run sbxloop doctor || echo "::warning::doctor reported failures (expected when e2e token secrets are not configured)"

      # The full sbx conformance suite against the real sbx binary: every
      # field-learned assumption (secret visibility under exec, cp dir
      # semantics, workspace mount discovery, ...) probed in a live scratch
      # sandbox. Drift against the verdicts this codebase was built for
      # FAILS the lane (#226): the 0.38 ls/mount changes (#210) were exactly
      # the kind of drift a warning line lets through. The scheduled
      # sbx-conformance workflow runs the same gate against the newest sbx
      # release ahead of adoption.
      - name: sbx conformance suite (doctor --deep)
        if: ${{ vars.E2E_SMOKE_ENABLED == 'true' }}
        env:
          SBXLOOP_APP_NAME: sbxloop-e2e
          COPILOT_GITHUB_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
        run: uv run sbxloop doctor --deep --fail-on-drift

      - name: Smoke run
        if: ${{ vars.E2E_SMOKE_ENABLED == 'true' }}
        env:
          SBXLOOP_APP_NAME: sbxloop-e2e
          COPILOT_GITHUB_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          SBXLOOP_BUDGETS__MAX_TASKS: "3"
          SBXLOOP_BUDGETS__MAX_WALL_CLOCK_S: "1800"
        run: |
          uv run sbxloop run "${{ inputs.smoke_outcome }}" --no-tui
          uv run sbxloop status

      # First real-sbx confirmation of workspace mount/harvest mode: the file
      # the agent writes must land on the HOST and be discoverable. Also the
      # validation point for Copilot working_directory and sbx cp directory
      # semantics (this step's name is what a `TODO(e2e "...")` marker in
      # the source may cite — see tests/unit/test_e2e_markers.py) — the
      # harvest and os.chdir fallbacks stay until this passes.
      - name: Assert artifacts landed on the host
        if: ${{ vars.E2E_SMOKE_ENABLED == 'true' }}
        env:
          SBXLOOP_APP_NAME: sbxloop-e2e
        run: |
          set -euo pipefail
          run_id=$(basename "$(ls -dt .sbxloop/runs/* | head -1)")
          uv run sbxloop artifacts "$run_id" --tree
          artifacts_dir=$(uv run sbxloop artifacts "$run_id" --path)
          test -f "$artifacts_dir/hello.txt"
          grep -q "hello sbxloop" "$artifacts_dir/hello.txt"

      # Multi-file delivery smoke (#66): a 50-file workspace must deliver as
      # O(1) batched blob jobs, visibly (gh.op_progress) and under a time
      # budget — the per-file-job regression this guards against took minutes.
      # Needs a scratch repo the E2E_GH_TOKEN can open PRs against.
      - name: Multi-file delivery smoke
        if: ${{ vars.E2E_SMOKE_ENABLED == 'true' && vars.E2E_DELIVER_REPO != '' }}
        env:
          SBXLOOP_APP_NAME: sbxloop-e2e
          COPILOT_GITHUB_TOKEN: ${{ secrets.E2E_COPILOT_GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.E2E_GH_TOKEN }}
          SBXLOOP_BUDGETS__MAX_TASKS: "3"
          SBXLOOP_BUDGETS__MAX_WALL_CLOCK_S: "1800"
          SBXLOOP_GITHUB__REPO: ${{ vars.E2E_DELIVER_REPO }}
          SBXLOOP_GITHUB__DELIVER: "true"
          SBXLOOP_GITHUB__DELIVER_DRAFT: "true"
        run: |
          uv run sbxloop run "Create exactly 50 files named artifact_00.txt through artifact_49.txt, each containing its own filename, using a shell loop" --no-tui

      - name: Assert batched delivery opened a PR within budget
        if: ${{ vars.E2E_SMOKE_ENABLED == 'true' && vars.E2E_DELIVER_REPO != '' }}
        run: |
          set -euo pipefail
          uv run --no-project python - <<'EOF'
          import json, sqlite3, sys

          db = sqlite3.connect(".sbxloop/state.db")
          db.row_factory = sqlite3.Row
          run_id = db.execute(
              "SELECT run_id FROM runs ORDER BY created_at DESC LIMIT 1"
          ).fetchone()["run_id"]
          events = db.execute(
              "SELECT ts, type, data_json FROM events WHERE run_id = ? ORDER BY seq",
              (run_id,),
          ).fetchall()

          deliver = [json.loads(e["data_json"]) for e in events if e["type"] == "run.deliver"]
          assert deliver, f"no run.deliver event for {run_id}"
          if "error" in deliver[-1]:
              sys.exit(f"delivery failed: {deliver[-1]['error']}")
          print(f"delivered PR: {deliver[-1].get('url')}")

          # Delivery starts at the first gh.op after run.artifacts; the whole
          # 50-file publish (blobs + tree + commit + ref + PR) must beat the
          # budget that one-job-per-file delivery could never meet.
          artifacts_ts = max(e["ts"] for e in events if e["type"] == "run.artifacts")
          gh_ts = [e["ts"] for e in events if e["type"].startswith("gh.") and e["ts"] >= artifacts_ts]
          deliver_ts = max(e["ts"] for e in events if e["type"] == "run.deliver")
          elapsed = deliver_ts - (min(gh_ts) if gh_ts else artifacts_ts)
          print(f"delivery took {elapsed:.1f}s")
          assert elapsed < 120, f"50-file delivery took {elapsed:.1f}s (budget 120s)"

          batch_progress = [e for e in events if e["type"] == "gh.op_progress"]
          assert batch_progress, "no gh.op_progress events — blob batching not exercised"
          EOF

      # Record-and-replay feed for the GitHub error fixture (#226): every
      # worker-shaped GitHub error string a real run produced, so a unit
      # stub never has to invent one (the 404-vs-409 empty-repo bug, #219).
      # Promote entries into tests/fixtures/github_field_errors.json by hand,
      # with the run id as provenance.
      - name: Capture GitHub error shapes
        if: ${{ always() && vars.E2E_SMOKE_ENABLED == 'true' }}
        run: |
          uv run --no-project python - <<'EOF'
          import json, sqlite3, pathlib

          path = pathlib.Path(".sbxloop/state.db")
          captured = []
          if path.exists():
              db = sqlite3.connect(path)
              rows = db.execute(
                  "SELECT run_id, type, data_json FROM events WHERE data_json LIKE '%HTTP %' ORDER BY seq"
              ).fetchall()
              for run_id, kind, data_json in rows:
                  data = json.loads(data_json)
                  error = data.get("error") or data.get("message")
                  if isinstance(error, str) and "HTTP " in error:
                      captured.append({"run_id": run_id, "event": kind, "message": error})
          pathlib.Path("github-error-shapes.json").write_text(json.dumps(captured, indent=2) + "\n")
          print(f"captured {len(captured)} GitHub error shape(s)")
          EOF
      - uses: actions/upload-artifact@v4
        if: ${{ always() && vars.E2E_SMOKE_ENABLED == 'true' }}
        with:
          name: github-error-shapes
          path: github-error-shapes.json
          if-no-files-found: ignore

      - name: Cleanup
        if: always()
        run: |
          uv run sbxloop sandbox rm --all || true
          sbx --app-name sbxloop-e2e logout --yes || true
