name: Deploy the daemon

# sbxloop's OWN deploy — the instance of the drain / hold / upgrade /
# health-check / roll-back pattern that keeps the dogfood daemon current.
# The reusable pattern, with nothing of this host in it, is
# contrib/workflows/deploy-daemon.yml.example (docs/deploy.md); what is
# specific to this host is docs/self-deploy.md.
#
# Deploys the release that Release just published to the daemon host, a
# self-hosted runner. Merge to main -> Release tags + publishes to PyPI (~4 min)
# -> this takes a named pause hold on the daemon, waits — without a cap — for
# the run in flight to finish, upgrades to that exact version, restarts the
# service, health-checks it, and restores every other hold. Any failed check
# rolls back to the version that was running before.
#
# NEVER RESTART UNDER A LIVE RUN (#534): since 1.0 the loop merges its own
# PRs, every merge deploys, and the next queued item is usually already
# running when the deploy lands. A capped drain that "restarts anyway" killed
# in-flight tasks and spent the item's resume budget for nothing of its own
# doing. The only bound on the wait is this job's timeout-minutes; on timeout
# nothing has been installed or restarted and the hold is released.
#
# THE HOST IS ONE VARIABLE (#640): the runner label — also the name the
# notices call the host — is the repository variable SBXLOOP_DEPLOY_HOST
# (default `db`). Every path is under the sbxloop home, ${HOME}/.sbxloop,
# the layout `sbxloop init` builds (contrib/systemd/README.md). Nothing
# else here names a machine or a user, and no step needs a working
# directory: every command answers the same from anywhere.
#
# SECURITY INVARIANT — DO NOT BREAK:
#   No job carrying the `self-hosted` label may be reachable from a
#   fork-triggerable event (pull_request, pull_request_target, issue_comment).
#   This repo is PUBLIC and the runner's user has passwordless root on the
#   host, so a fork-triggered job on this runner would be a full host
#   compromise. The two triggers below are safe: `workflow_run` fires only
#   from Release (push to main only, base-repo context), and
#   `workflow_dispatch` needs write access.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy (X.Y.Z). Blank = latest on PyPI."
        required: false
        default: ""

# Never cancel a deploy mid-restart; let a newer one queue behind it. (GitHub
# keeps at most one *pending* job per group: a third release cancels the
# second's pending deploy and deploys itself, which is the right version.)
concurrency:
  group: deploy-daemon
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # A failed/cancelled Release has nothing to deploy.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, "${{ vars.SBXLOOP_DEPLOY_HOST || 'db' }}"]
    # Bounds the idle wait. 1.0 runs take 14–180 min (#512 ran 182); the
    # engine's own wall clock ([budgets] max_wall_clock_s, 2 h by default)
    # does not cover CI and landing waits. A timeout here installs nothing:
    # the hold is released and the daemon runs on as it was.
    timeout-minutes: 480

    defaults:
      run:
        # Explicit: the runner user's login shell may be zsh, where `status`
        # is a read-only special variable. Actions defaults to bash on Linux
        # anyway.
        shell: bash

    # No actions/checkout: the deploy installs from the release and needs
    # nothing from the tree. Skipping it keeps the runner's _work empty and
    # removes the largest supply-chain surface on a root-equivalent host.

    env:
      # The host, as the notices name it (and the runner label above).
      HOST: ${{ vars.SBXLOOP_DEPLOY_HOST || 'db' }}
      UNIT: sbxloop-daemon
      # This deploy's pause hold (#534). The operator's own `pause` is a
      # separate hold: it survives the deploy, and we release only ours.
      HOLD: deploy-${{ github.run_id }}
      # How `ctl status --json` reads: the run in flight, else the claim in
      # progress (a restart there orphans the issue, #530), else idle.
      CURRENT_JQ: >-
        if .current != null then "\(.current.run_id) — \(.current.title)"
        elif (.claiming // null) != null then "claiming \(.claiming)"
        else "idle" end

    steps:
      - name: Resolve host paths
        # Every path the deploy touches is under the sbxloop home. Written
        # to GITHUB_ENV because a job-level `env:` value is a literal — the
        # shell would not expand a ${HOME} inside it.
        run: |
          set -euo pipefail
          {
            echo "SBXLOOP_HOME=${HOME}/.sbxloop"
            # The launcher: binds every command to the home (PATH with
            # /usr/sbin for mkfs.ext4, dbus, the home's tmp and caches) and
            # execs the venv. It exports no secrets; sbxloop reads its
            # own secrets file itself.
            echo "SBXLOOP=${HOME}/.sbxloop/bin/sbxloop"
            echo "VENV_SBXLOOP=${HOME}/.sbxloop/venv/bin/sbxloop"
            echo "VENV_PYTHON=${HOME}/.sbxloop/venv/bin/python"
            # The home's own uv, and where it keeps its cache and interpreters.
            echo "UV=${HOME}/.sbxloop/bin/uv"
            echo "UV_CACHE_DIR=${HOME}/.sbxloop/cache/uv"
            echo "UV_PYTHON_INSTALL_DIR=${HOME}/.sbxloop/python"
          } >> "$GITHUB_ENV"

      - name: Resolve the target version
        id: target
        env:
          # The host's environment may export its own GH_TOKEN (a PAT). Set
          # it explicitly so gh talks to the API as this workflow, not as
          # the host.
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_VERSION}" ]; then
            version="${INPUT_VERSION#v}"
            echo "dispatched: v${version}"
          elif [ -n "${HEAD_SHA:-}" ]; then
            # Annotated tags: use /tags (.commit.sha is the commit) rather than
            # /git/refs/tags, whose .object.sha is the tag object.
            version="$(gh api "repos/${REPO}/tags" --paginate \
              --jq ".[] | select(.commit.sha==\"${HEAD_SHA}\") | .name" | head -n1)"
            version="${version#v}"
            if [ -z "${version}" ]; then
              # Release's ancestor guard skipped tagging (nothing new to ship),
              # or it tagged a newer tip. Fall back to the latest release.
              version="$(gh release view --repo "${REPO}" --json tagName --jq .tagName)"
              version="${version#v}"
              echo "no tag on ${HEAD_SHA}; falling back to latest release v${version}"
            else
              echo "released commit ${HEAD_SHA} is v${version}"
            fi
          else
            version="$(gh release view --repo "${REPO}" --json tagName --jq .tagName)"
            version="${version#v}"
          fi
          [ -n "${version}" ] || { echo "::error::could not resolve a version to deploy"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Compare against what is installed
        id: installed
        run: |
          set -euo pipefail
          current="$("${VENV_SBXLOOP}" --version | awk '{print $2}')"
          echo "current=${current}" >> "$GITHUB_OUTPUT"
          if [ "${current}" = "${{ steps.target.outputs.version }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${HOST} is already at ${current} — nothing to deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::deploying ${current} -> ${{ steps.target.outputs.version }}"
          fi

      - name: Take the deploy hold
        id: hold
        if: steps.installed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Exit 2 = no daemon answered. Not fatal here: the wait below
          # notices a daemon that never answers, and the health check is
          # the thing that fails if it never comes up.
          "${SBXLOOP}" daemon ctl pause --hold "${HOLD}" --timeout 30 || true
          status="$("${SBXLOOP}" daemon ctl status --json --timeout 30 || true)"
          echo "${status}"
          current="$(jq -r "${CURRENT_JQ}" <<<"${status}" 2>/dev/null || true)"
          echo "current=${current:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Announce
        if: steps.installed.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          FROM: ${{ steps.installed.outputs.current }}
          CURRENT: ${{ steps.hold.outputs.current }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
        run: |
          set -euo pipefail
          if [ "${CURRENT}" = "idle" ] || [ "${CURRENT}" = "unknown" ]; then
            MSG="🚀 deploying sbxloop \`${FROM}\` → \`${VERSION}\` on \`${HOST}\` — [run](${RUN_URL})"
          else
            MSG="🚀 sbxloop \`${FROM}\` → \`${VERSION}\` staged on \`${HOST}\` — restart deferred until the daemon is idle (now: ${CURRENT}); hold \`${HOLD}\` — [run](${RUN_URL})"
          fi
          # Through the configured [chat] backend, with the bot already in
          # the channel: this job reads no secrets file and no config (#639).
          "${SBXLOOP}" daemon notify "${MSG}"

      - name: Fetch the release wheels
        id: wheels
        if: steps.installed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          # Install from the GitHub Release, not PyPI. Release attaches the
          # same dist/ it uploads to PyPI, and it exists the moment Release
          # finishes — whereas the PyPI simple index is Fastly-cached with
          # `max-age=600`, so for up to ten minutes pip can still be served an
          # index that predates the upload. Two deploys died that way: v0.7.17
          # on `sbxloop`, then v0.7.18 on `sbxloop-worker`, which is a separate
          # project with its own independently-cached index page.
          dist="$(mktemp -d)"
          echo "dist=${dist}" >> "$GITHUB_OUTPUT"
          for attempt in 1 2 3 4 5; do
            if gh release download "v${VERSION}" --repo "${REPO}" --dir "${dist}" \
                 --pattern '*.whl' --clobber; then
              ls -1 "${dist}"
              exit 0
            fi
            echo "release v${VERSION} not downloadable yet (attempt ${attempt}); retrying in 15s"
            sleep 15
          done
          echo "::error::could not download the wheels for v${VERSION}"
          exit 1

      - name: Wait for the daemon to go idle
        id: drain
        if: steps.installed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # No cap (#534): a restart under a live run kills its in-flight task
          # and spends a resume-budget slot the item did nothing to deserve.
          # With the hold taken, nothing new is claimed, so once the status
          # reads idle it stays idle. A claim in progress counts as busy: a
          # restart in the claim window orphans the issue (#530).
          # Poll no faster than 15s: issue #309, status() mutates the circuit
          # breaker (it half-opens and decrements consecutive_failures).
          # A daemon that answers nothing for 5 minutes straight has nothing
          # to drain — the restart (and health check) is what fixes it.
          # Exit 1 is neither: the daemon answered, but not with JSON (it
          # predates `ctl status --json`) or not in time. Fail here, before
          # anything is installed, rather than guess at its state.
          waited=0
          misses=0
          while :; do
            set +e
            status="$("${SBXLOOP}" daemon ctl status --json --timeout 30)"
            rc=$?
            set -e
            if [ "${rc}" -eq 0 ]; then
              misses=0
              current="$(jq -r "${CURRENT_JQ}" <<<"${status}")"
              if [ "${current}" = "idle" ]; then
                echo "daemon is idle after ${waited}s — safe to restart"
                echo "waited_s=${waited}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              echo "not idle (${current}) — waiting (${waited}s so far)"
            elif [ "${rc}" -eq 1 ]; then
              echo "::error::the daemon answered ctl status but gave no structured status — upgrade it by hand once (contrib/systemd/README.md), then redeploy"
              exit 1
            else
              misses=$((misses + 1))
              echo "no answer from the daemon (${misses}/20)"
              if [ "${misses}" -ge 20 ]; then
                echo "::warning::no daemon answered ctl status for 5 min — nothing to drain; restarting"
                echo "waited_s=${waited}" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
            sleep 15
            waited=$((waited + 15))
          done

      - name: Upgrade
        id: upgrade
        if: steps.installed.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          DIST: ${{ steps.wheels.outputs.dist }}
        run: |
          set -euo pipefail
          # A snapshot first: config, secrets, units and the state database, so a bad
          # release is one `sbxloop backup restore` away. The daily sweep
          # keeps the newest [daemon] backups_keep of these.
          # The label is what the *installed* sbxloop accepts: letters, digits,
          # - and _ on every release, so the dots in the version become dashes.
          "${SBXLOOP}" backup --label "deploy-${VERSION//./-}" --reason "deploy ${{ steps.installed.outputs.current }} -> ${VERSION}"
          # Both wheels together, from the release: the host wheel pins
          # sbxloop-worker==VERSION exactly, and naming the local worker wheel
          # satisfies that pin without the index being consulted for it at all.
          # Both chat extras go in, so switching [chat] backend on the host is
          # a config change, not a reinstall. Everything else (pydantic,
          # discord.py, slack_sdk) still resolves from PyPI, which is fine:
          # those are not racing a just-published version.
          "${UV}" pip install --python "${VENV_PYTHON}" --upgrade \
            "${DIST}/sbxloop_worker-${VERSION}-py3-none-any.whl" \
            "${DIST}/sbxloop-${VERSION}-py3-none-any.whl[discord,slack]"
          "${VENV_SBXLOOP}" --version
          # Idempotent: refreshes the launchers and the rendered units for
          # the new version, keeps config, secrets and sbx as they are.
          "${SBXLOOP}" init --systemd
          mkdir -p "${SBXLOOP_HOME}/logs/deploy"
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) ${{ steps.installed.outputs.current }} -> ${VERSION} run=${{ github.run_id }}" >> "${SBXLOOP_HOME}/logs/deploy/history.log"

      - name: Snapshot the holds to restore
        id: state
        if: steps.installed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Holds are in-memory (#308), so the restart drops every one of
          # them. Read them *now*, not at the start of the job: an operator
          # who paused during the wait must still be paused afterwards.
          # Ours is dropped from the list — the restart releases it.
          status="$("${SBXLOOP}" daemon ctl status --json --timeout 30 || true)"
          echo "${status}"
          holds="$(jq -r '.holds // [] | .[]' <<<"${status}" 2>/dev/null | tr '\n' ' ' || true)"
          keep=""
          for h in ${holds}; do
            [ "${h}" = "${HOLD}" ] && continue
            keep="${keep} ${h}"
          done
          keep="${keep# }"
          echo "holds=${keep}" >> "$GITHUB_OUTPUT"
          if [ -n "${keep}" ]; then
            echo "::notice::holds to restore after the restart: ${keep}"
          fi

      - name: Restart the daemon
        if: steps.installed.outputs.changed == 'true'
        run: |
          set -euo pipefail
          # Without reset-failed, StartLimitBurst=5 / StartLimitIntervalSec=600
          # leaves a previously crash-looping unit `failed` and NOT restartable.
          systemctl --user reset-failed "${UNIT}" || true
          # TimeoutStopSec=120 plus shutdown_grace_s=60: the stop half alone can
          # take three minutes.
          timeout 300 systemctl --user restart "${UNIT}"

      - name: Health check
        id: health
        if: steps.installed.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::health check failed: $1"; exit 1; }

          systemctl --user is-active --quiet "${UNIT}" || fail "unit is not active"

          got="$("${VENV_SBXLOOP}" --version | awk '{print $2}')"
          [ "${got}" = "${VERSION}" ] || fail "version is ${got}, expected ${VERSION}"

          # Never --deep here: that boots a microVM. Plain doctor covers exactly
          # what a restart can break — sbx login, tokens, template, worker
          # wheel, the home and its units, chat bridge.
          "${SBXLOOP}" doctor || fail "sbxloop doctor is unhappy"

          # ctl exit 2 = nothing claimed the request, i.e. the daemon never came up.
          # The budget has to cover the daemon's whole startup, not just the
          # round trip: the control server starts only after loop.recover(),
          # which took 67s on the 0.7.23 deploy (four orphaned runs to settle,
          # a concierge sandbox to re-provision) against a 60s budget. The
          # client resends across that window rather than reporting the
          # refusal, so the only thing left to get wrong is being too stingy
          # here — 300s is well inside the job's timeout.
          "${SBXLOOP}" daemon ctl status --json --timeout 300 >/dev/null || fail "daemon did not answer ctl status"

          # Let it settle, then prove it is not crash-looping.
          before="$(systemctl --user show "${UNIT}" -p NRestarts --value)"
          sleep 45
          systemctl --user is-active --quiet "${UNIT}" || fail "unit died within 45s of starting"
          after="$(systemctl --user show "${UNIT}" -p NRestarts --value)"
          [ "${before}" = "${after}" ] || fail "unit restarted ${before} -> ${after} within 45s (crash loop)"

          echo "::notice::${HOST} is healthy on ${VERSION}"

      - name: Roll back
        # Only once the upgrade ran: a failure before it (wheels, the wait)
        # has changed nothing on the host, and a rollback restart would be
        # exactly the needless restart this pipeline exists to avoid.
        if: failure() && steps.installed.outputs.changed == 'true' && steps.upgrade.outcome != 'skipped'
        env:
          PREV: ${{ steps.installed.outputs.current }}
        run: |
          set -euo pipefail
          echo "::error::deploy failed — rolling back to ${PREV}"
          # PyPI is safe here: PREV has been published for a while, so its index
          # page is long since warm. No just-published version to race.
          # The same extras as the upgrade (#619): a rollback that drops one
          # rolls a host on that backend back to a build that cannot start.
          "${UV}" pip install --python "${VENV_PYTHON}" --upgrade "sbxloop[discord,slack]==${PREV}" "sbxloop-worker==${PREV}"
          "${SBXLOOP}" init --systemd || true
          systemctl --user reset-failed "${UNIT}" || true
          timeout 300 systemctl --user restart "${UNIT}"
          sleep 15
          systemctl --user is-active --quiet "${UNIT}" \
            && echo "rolled back to $("${VENV_SBXLOOP}" --version | awk '{print $2}')" \
            || echo "::error::ROLLBACK ALSO FAILED — ${HOST} needs a human"

      - name: Restore the other holds
        # Runs after a rollback too: whatever version is live, the operator's
        # intent must survive. Required because holds are in-memory only
        # (#308), so the daemon always comes back claiming work.
        if: always() && steps.installed.outputs.changed == 'true' && steps.state.outcome == 'success'
        env:
          HOLDS: ${{ steps.state.outputs.holds }}
        run: |
          set -euo pipefail
          # Must run AFTER the restart: ControlServer refuses any request
          # stamped before the daemon started ("resend it").
          for h in ${HOLDS}; do
            "${SBXLOOP}" daemon ctl pause --hold "${h}" --timeout 60 \
              || echo "::warning::could not restore hold ${h}"
          done

      - name: Release the deploy hold
        # Whatever happened — timed out waiting, failed before the restart —
        # our hold must not outlive the job. After a restart it is already
        # gone (in-memory) and this is a no-op.
        if: always() && steps.hold.outcome == 'success'
        run: |
          set -euo pipefail
          "${SBXLOOP}" daemon ctl resume --hold "${HOLD}" --timeout 60 \
            || echo "::warning::could not release hold ${HOLD}"
          "${SBXLOOP}" daemon ctl status --timeout 60 || true

      - name: Clean up the downloaded wheels
        if: always() && steps.wheels.outputs.dist != ''
        run: rm -rf -- "${{ steps.wheels.outputs.dist }}"

      - name: Report
        if: always() && steps.installed.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.target.outputs.version }}
          FROM: ${{ steps.installed.outputs.current }}
          RESULT: ${{ job.status }}
          WAITED_S: ${{ steps.drain.outputs.waited_s }}
          UPGRADED: ${{ steps.upgrade.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        continue-on-error: true
        run: |
          set -euo pipefail
          waited=""
          if [ "${WAITED_S:-0}" -gt 0 ] 2>/dev/null; then
            waited=" after waiting $((WAITED_S / 60)) min for the daemon to go idle"
          fi
          if [ "${RESULT}" = "success" ]; then
            MSG="✅ \`${HOST}\` restarted on sbxloop \`${VERSION}\`${waited} — [run](${RUN_URL})"
          elif [ "${UPGRADED}" = "skipped" ]; then
            MSG="❌ deploy of sbxloop \`${VERSION}\` to \`${HOST}\` **${RESULT}** before anything was installed — still on \`${FROM}\`, daemon untouched. [run](${RUN_URL})"
          else
            MSG="❌ deploy of sbxloop \`${VERSION}\` to \`${HOST}\` **${RESULT}** — rolled back to \`${FROM}\`. [run](${RUN_URL})"
          fi
          # Through the configured [chat] backend (#639): sbxloop reads its
          # own secrets file; this job reads no secrets and no config.
          "${SBXLOOP}" daemon notify "${MSG}"
