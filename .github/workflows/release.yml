name: Release
run-name: ${{ inputs.automatic && 'Automatic release' || 'Manual release' }}

# release-wakeup.yml coalesces pushes and reconciliation into automatic requests.
# Each batch waits three quiet minutes, at most thirty, then freezes one SHA.
# Keep this workflow/environment identity: both PyPI Trusted Publishers use it.
on:
  workflow_dispatch:
    inputs:
      automatic:
        description: Automatic intake request (keep the quiet window)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false
  # A push must not replace a pending manual release.
  queue: max

permissions:
  contents: read
  actions: read

jobs:
  batch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.batch.outputs.sha }}
      version: ${{ steps.batch.outputs.version }}
      proceed: ${{ steps.batch.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Collect the release batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ !inputs.automatic }}
        run: python3 scripts/release_pipeline.py batch
      - name: Keep the helper with the frozen plan
        run: cp scripts/release_pipeline.py scripts/smoke_wheels.py pipeline/
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: pipeline/
          if-no-files-found: error

  evidence:
    needs: batch
    if: needs.batch.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      reused: ${{ steps.evidence.outputs.reused }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: pipeline
      - name: Verify CI evidence for the frozen commit
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.batch.outputs.sha }}
        run: python3 pipeline/release_pipeline.py verification

  verify:
    needs: [batch, evidence]
    if: needs.evidence.outputs.reused == 'false'
    uses: ./.github/workflows/ci.yml
    with:
      sha: ${{ needs.batch.outputs.sha }}

  check:
    needs: [evidence, verify]
    if: ${{ always() && needs.evidence.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require reused evidence or a successful full verification
        env:
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          REUSED: ${{ needs.evidence.outputs.reused }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          test "$EVIDENCE_RESULT" = success
          if [ "$REUSED" = true ]; then
            test "$VERIFY_RESULT" = skipped
          else
            test "$REUSED" = false
            test "$VERIFY_RESULT" = success
          fi

  release:
    needs: [batch, check]
    # Reuse deliberately skips verify. Override implicit success() while
    # still requiring the explicit verdict and honoring cancellation.
    if: >-
      ${{ !cancelled() && needs.batch.result == 'success' &&
          needs.batch.outputs.proceed == 'true' && needs.check.result == 'success' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.batch.outputs.version }}
      RELEASE_SHA: ${{ needs.batch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.batch.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Reserve the tested version
        run: |
          set -euo pipefail
          echo "PLAN=${RUNNER_TEMP}/release-plan/plan.json" >> "$GITHUB_ENV"
          git fetch --tags --force --quiet
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            [ "$(git rev-parse "v${VERSION}^{commit}")" = "${RELEASE_SHA}" ]
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" "${RELEASE_SHA}" -m "Release v${VERSION}"
            git push origin "refs/tags/v${VERSION}"
          fi
      - name: Restore the original files for a publication retry
        id: staged
        run: python3 "${RUNNER_TEMP}/release-plan/release_pipeline.py" restore
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Build both distributions once
        if: steps.staged.outputs.reused != 'true'
        run: |
          uv build --package sbxloop-worker -o dist
          uv build --package sbxloop -o dist
      - name: Assert the matching worker wheel is vendored
        run: |
          unzip -l "dist/sbxloop-${VERSION}-py3-none-any.whl" \
            | grep -F "sbxloop/_vendor/sbxloop_worker-${VERSION}-py3-none-any.whl"
      - name: Smoke the final wheels in a clean environment
        run: python3 "${RUNNER_TEMP}/release-plan/smoke_wheels.py" dist "${VERSION}"
      - name: Stage original files before any PyPI upload
        run: python3 "${RUNNER_TEMP}/release-plan/release_pipeline.py" stage
      - name: Publish both distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Retries reuse the draft's original bytes if one upload failed.
          skip-existing: true
      - name: Publish the completed GitHub Release
        id: publish
        run: python3 "${RUNNER_TEMP}/release-plan/release_pipeline.py" publish

  result:
    needs: [batch, check, release]
    if: >-
      always() && needs.batch.result == 'success' &&
      (needs.batch.outputs.proceed != 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: pipeline
      - name: Record publication or an explicit no-op
        env:
          PLAN: pipeline/plan.json
          PUBLISHED: ${{ needs.release.outputs.published }}
        run: python3 pipeline/release_pipeline.py receipt
      - uses: actions/upload-artifact@v4
        with:
          name: release-result
          path: release-result.json
          if-no-files-found: error
