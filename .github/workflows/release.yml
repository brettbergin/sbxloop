name: Release

# Pushes wake one serialized batch: three quiet minutes, at most thirty minutes
# from the first observation, then one frozen SHA. Redundant wakeups no-op.
# Keep this workflow/environment identity: both PyPI Trusted Publishers use it.
on:
  push:
    branches: [main]
  # Catch up after a missed push or after finishing an older partial release.
  # Already-published main exits without checks, tagging, or uploading.
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch: {}  # Release now: bypass the quiet window.

concurrency:
  group: release
  cancel-in-progress: false
  # A push must not replace a pending manual release.
  queue: max

permissions:
  contents: read

jobs:
  batch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      sha: ${{ steps.batch.outputs.sha }}
      version: ${{ steps.batch.outputs.version }}
      proceed: ${{ steps.batch.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Collect the release batch
        id: batch
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/release_pipeline.py batch
      - name: Keep the helper with the frozen plan
        run: cp scripts/release_pipeline.py pipeline/
      - uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: pipeline/
          if-no-files-found: error

  check:
    needs: batch
    if: needs.batch.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.batch.outputs.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run bandit -c pyproject.toml -r packages/sbxloop/src packages/sbxloop-worker/src
      - run: uv run pytest --cov=sbxloop --cov=sbxloop_worker --cov-report=term-missing --cov-fail-under=85

  release:
    needs: [batch, check]
    if: needs.batch.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.batch.outputs.version }}
      RELEASE_SHA: ${{ needs.batch.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.batch.outputs.sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: ${{ runner.temp }}/release-plan
      - name: Reserve the tested version
        run: |
          set -euo pipefail
          echo "PLAN=${RUNNER_TEMP}/release-plan/plan.json" >> "$GITHUB_ENV"
          git fetch --tags --force --quiet
          if git show-ref --verify --quiet "refs/tags/v${VERSION}"; then
            [ "$(git rev-parse "v${VERSION}^{commit}")" = "${RELEASE_SHA}" ]
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v${VERSION}" "${RELEASE_SHA}" -m "Release v${VERSION}"
            git push origin "refs/tags/v${VERSION}"
          fi
      - name: Restore the original files for a publication retry
        id: staged
        run: python3 "${RUNNER_TEMP}/release-plan/release_pipeline.py" restore
      - uses: astral-sh/setup-uv@v5
        if: steps.staged.outputs.reused != 'true'
      - name: Build both distributions once
        if: steps.staged.outputs.reused != 'true'
        run: |
          uv build --package sbxloop-worker -o dist
          uv build --package sbxloop -o dist
      - name: Assert the matching worker wheel is vendored
        run: |
          unzip -l "dist/sbxloop-${VERSION}-py3-none-any.whl" \
            | grep -F "sbxloop/_vendor/sbxloop_worker-${VERSION}-py3-none-any.whl"
      - name: Stage original files before any PyPI upload
        run: python3 "${RUNNER_TEMP}/release-plan/release_pipeline.py" stage
      - name: Publish both distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Retries reuse the draft's original bytes if one upload failed.
          skip-existing: true
      - name: Publish the completed GitHub Release
        id: publish
        run: python3 "${RUNNER_TEMP}/release-plan/release_pipeline.py" publish

  result:
    needs: [batch, check, release]
    if: >-
      always() && needs.batch.result == 'success' &&
      (needs.batch.outputs.proceed != 'true' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: pipeline
      - name: Record publication or an explicit no-op
        env:
          PLAN: pipeline/plan.json
          PUBLISHED: ${{ needs.release.outputs.published }}
        run: python3 pipeline/release_pipeline.py receipt
      - uses: actions/upload-artifact@v4
        with:
          name: release-result
          path: release-result.json
          if-no-files-found: error
