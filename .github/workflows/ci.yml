name: CI

on:
  push:
    branches: [main, "sdx/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build --package sbxloop-worker -o dist
      - run: uv build --package sbxloop -o dist
      - name: Assert worker wheel is vendored inside the host wheel
        run: |
          unzip -l dist/sbxloop-*.whl | grep 'sbxloop/_vendor/sbxloop_worker-.*\.whl'
      - name: List artifacts
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
