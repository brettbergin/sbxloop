name: CI

on:
  push:
    # main alone: working branches get CI through their pull request, and a
    # push filter that also matched them would run every job twice per PR.
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      sha:
        description: Frozen release commit to verify
        required: true
        type: string

concurrency:
  # Reusable release verification must never cancel ordinary main CI.
  group: ci-${{ github.workflow }}-${{ inputs.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Every static gate in one runner. These were four jobs (format, mdformat,
  # lint, security); each spent ~10s on checkout and `uv sync` to do ~5s of
  # work, and all four finished more than three minutes before the pytest
  # shards that decide how long a run takes. They cost concurrency, not wall
  # clock, and concurrency is what the shards below need: the per-account cap
  # on GitHub-hosted jobs is 20 on the Free plan, and this workflow was
  # sitting at 19.
  #
  # The job keeps the name `lint` because that is a required status check on
  # main — renaming it, or splitting a required context back out, wedges every
  # pull request behind a check that never reports. `typecheck` and `build`
  # stay their own jobs for the same reason.
  #
  # `!cancelled()` on each gate so one failure does not hide the rest: a ruff
  # diff and a bandit finding are reported in the same run, the way they were
  # when these were separate jobs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync ruff format --check .
        if: ${{ !cancelled() }}
      - run: uv run --no-sync ruff check .
        if: ${{ !cancelled() }}
      - run: uv run --no-sync mdformat --check .
        if: ${{ !cancelled() }}
      - run: uv run --no-sync python scripts/check_self_references.py
        if: ${{ !cancelled() }}
      - run: uv run --no-sync bandit -c pyproject.toml -r packages/sbxloop/src packages/sbxloop-worker/src
        if: ${{ !cancelled() }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync mypy

  # Exercise the published optional SDK against a fake stdio process. No
  # inference credentials, model calls or real Codex runtime are involved.
  codex-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --extra codex --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -n0 tests/unit/test_codex_sdk_contract.py

  # Exercise the published openai client against a local server speaking
  # the chat-completions wire shape. No credentials, models or endpoints
  # beyond the loopback stub are involved.
  openai-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --extra openai --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -n0 tests/unit/test_openai_sdk_contract.py

  # Use the shipped preset to install and drive Chromium, without an agent
  # credential. Browser software is installed only in this dedicated runner.
  playwright-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --all-packages
      - run: uv run --no-sync pytest -n0 tests/unit/test_playwright_preset_runtime.py
        env:
          SBXLOOP_TEST_PLAYWRIGHT: "1"

  # Five mixed shards per interpreter share the entire test workload. The
  # former two-fast/three-slow split left fast runners on the critical path
  # after the process-bound jobs finished. Keep ten test runners in total;
  # CRC32(nodeid) partitions every test once and xdist worksteal balances each
  # runner. JUnit artifacts and --durations retain evidence for comparisons.
  # Required contexts remain test (3.13) / test (3.14), independent of layout.
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --python ${{ matrix.python-version }}
      - run: uv run --no-sync --python ${{ matrix.python-version }} pytest --shard ${{ matrix.shard }}/5 --cov=sbxloop --cov=sbxloop_worker --cov-report= --durations=25 --junitxml=reports/junit-${{ matrix.python-version }}-${{ matrix.shard }}.xml
        env:
          COVERAGE_FILE: .coverage.${{ matrix.shard }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.shard }}
          path: .coverage.${{ matrix.shard }}
          include-hidden-files: true
          if-no-files-found: error
      - name: Keep test timings and failures
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.python-version }}-${{ matrix.shard }}
          path: reports/
          retention-days: 14

  # The host-portability rows a Linux runner cannot settle: where a real venv
  # puts its entry points, what `chmod` does to a file on Windows, and which
  # home `USERPROFILE` alone resolves to. One job runs `-m windows_host` —
  # the cross-platform branches these guard are covered in the Linux shards
  # through injected seams, and the suite at large assumes a POSIX host.
  # Native Windows install and host portability run on a disposable runner.
  # The suite at large assumes POSIX, so select its Windows host tests here;
  # build the two workspace wheels and exercise init with Docker's real MSI.
  # A hosted runner need not support nested microVMs, so this verifies install
  # and CLI readiness, not a live sandbox boot.
  # Keep it one job: the workflow's peak is near the 20-concurrent cap on
  # the Free plan (see the pytest job's comment).
  windows-host:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --python 3.13
      - run: uv run --no-sync --python 3.13 pytest -m windows_host
      - name: Native install smoke test
        shell: pwsh
        env:
          SBXLOOP_HOME: ${{ runner.temp }}\sbxloop-home
        run: |
          uv build --package sbxloop-worker -o dist
          uv build --package sbxloop -o dist
          uv run --no-sync --python 3.13 sbxloop init --no-systemd --wheels dist
          if ($LASTEXITCODE -ne 0) { throw "sbxloop init failed" }
          & "$env:LOCALAPPDATA\DockerSandboxes\bin\sbx.exe" version
          if ($LASTEXITCODE -ne 0) { throw "sbx version failed" }
          if (!(Test-Path "$env:SBXLOOP_HOME\sbx\VERSION")) { throw "init did not verify sbx" }
          if (!(Test-Path "$env:SBXLOOP_HOME\home.json")) { throw "init did not record the home" }

  test:
    needs: [pytest, codex-sdk, openai-sdk, playwright-preset]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Check out verdict helpers from the trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: scripts/ci_checks.py
          sparse-checkout-cone-mode: false
      - name: Require successful test and contract jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .ci-tools/scripts/ci_checks.py dependencies pytest codex-sdk openai-sdk playwright-preset
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-packages --python ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ matrix.python-version }}-*
          merge-multiple: true
      - name: Require every coverage slice
        run: python3 .ci-tools/scripts/ci_checks.py coverage 1 2 3 4 5
      - run: uv run --no-sync --python ${{ matrix.python-version }} coverage combine .coverage.*
      - run: uv run --no-sync --python ${{ matrix.python-version }} coverage report --show-missing --fail-under=85

  # Release only reuses a run carrying this complete, fail-closed verdict.
  verified:
    needs: [lint, typecheck, test, build, windows-host]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
      - name: Check out verdict helpers from the trusted workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          path: .ci-tools
          sparse-checkout: scripts/ci_checks.py
          sparse-checkout-cone-mode: false
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 .ci-tools/scripts/ci_checks.py dependencies lint typecheck test build windows-host

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha || github.sha }}
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build --package sbxloop-worker -o dist
      - run: uv build --package sbxloop -o dist
      - name: Assert worker wheel is vendored inside the host wheel
        run: |
          unzip -l dist/sbxloop-*.whl | grep 'sbxloop/_vendor/sbxloop_worker-.*\.whl'
      - name: List artifacts
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
