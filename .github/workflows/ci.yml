name: CI

on:
  push:
    # main alone: working branches get CI through their pull request, and a
    # push filter that also matched them would run every job twice per PR.
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Every static gate in one runner. These were four jobs (format, mdformat,
  # lint, security); each spent ~10s on checkout and `uv sync` to do ~5s of
  # work, and all four finished more than three minutes before the pytest
  # shards that decide how long a run takes. They cost concurrency, not wall
  # clock, and concurrency is what the shards below need: the per-account cap
  # on GitHub-hosted jobs is 20 on the Free plan, and this workflow was
  # sitting at 19.
  #
  # The job keeps the name `lint` because that is a required status check on
  # main — renaming it, or splitting a required context back out, wedges every
  # pull request behind a check that never reports. `typecheck` and `build`
  # stay their own jobs for the same reason.
  #
  # `!cancelled()` on each gate so one failure does not hide the rest: a ruff
  # diff and a bandit finding are reported in the same run, the way they were
  # when these were separate jobs.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run ruff format --check .
        if: ${{ !cancelled() }}
      - run: uv run ruff check .
        if: ${{ !cancelled() }}
      - run: uv run mdformat --check .
        if: ${{ !cancelled() }}
      - run: uv run python scripts/check_self_references.py
        if: ${{ !cancelled() }}
      - run: uv run bandit -c pyproject.toml -r packages/sbxloop/src packages/sbxloop-worker/src
        if: ${{ !cancelled() }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages
      - run: uv run mypy

  # Exercise the published optional SDK against a fake stdio process. No
  # inference credentials, model calls or real Codex runtime are involved.
  codex-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra codex --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -n0 tests/unit/test_codex_sdk_contract.py

  # Exercise the published openai client against a local server speaking
  # the chat-completions wire shape. No credentials, models or endpoints
  # beyond the loopback stub are involved.
  openai-sdk:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --extra openai --python ${{ matrix.python-version }}
      - run: uv run --no-sync pytest -n0 tests/unit/test_openai_sdk_contract.py

  # Use the shipped preset to install and drive Chromium, without an agent
  # credential. Browser software is installed only in this dedicated runner.
  playwright-preset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --all-packages
      - run: uv run pytest -n0 tests/unit/test_playwright_preset_runtime.py
        env:
          SBXLOOP_TEST_PLAYWRIGHT: "1"

  # The suite in five slices per interpreter: the ~5700 in-process tests over
  # two runners, and the ~950 process-bound `slow` tests (fake sbx, real
  # workers, real git) over three, all cut by the deterministic `--shard` from
  # the root conftest. Each slice writes its own coverage data; `test` below
  # combines them and holds the 85% line, so the required contexts stay
  # `test (3.13)` / `test (3.14)` however many slices there are.
  #
  # Five, not three, because the shards set the run's length and neither half
  # fits in one runner any more: measured on main, `fast` ran 220s and the two
  # `slow` halves 185s and 251s, against a 292s run. The suite has roughly
  # half again as many tests as when the two-way split was written (#750), and
  # a slice cannot go below the largest single unit you refuse to cut — so
  # cutting `fast` in two and `slow` in three lands both near 150s.
  #
  # `--shard` runs before pytest's own `-m` filter (root conftest, tryfirst),
  # so it slices the whole collection and each `-m` selection then falls out
  # of the slice. Verified to partition exactly: the fast shards sum to 5717
  # at every width tried.
  #
  # Ten pytest jobs put the workflow's peak at 18 concurrent (`test` needs
  # `pytest`, so its two run after everything else has finished), against a
  # per-account cap of 20 on the Free plan. If jobs start queuing rather than
  # all starting at once, that is the cap, not the runners — drop `fast` back
  # to one slice before touching anything else.
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        slice: [fast-1, fast-2, slow-1, slow-2, slow-3]
        include:
          - slice: fast-1
            select: -m "not slow" --shard 1/2
          - slice: fast-2
            select: -m "not slow" --shard 2/2
          - slice: slow-1
            select: -m slow --shard 1/3
          - slice: slow-2
            select: -m slow --shard 2/3
          - slice: slow-3
            select: -m slow --shard 3/3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest ${{ matrix.select }} --cov=sbxloop --cov=sbxloop_worker --cov-report=
        env:
          COVERAGE_FILE: .coverage.${{ matrix.slice }}
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}-${{ matrix.slice }}
          path: .coverage.${{ matrix.slice }}
          include-hidden-files: true
          if-no-files-found: error

  # The host-portability rows a Linux runner cannot settle: where a real venv
  # puts its entry points, what `chmod` does to a file on Windows, and which
  # home `USERPROFILE` alone resolves to. One job, `-m windows_host` only —
  # the cross-platform branches these guard are covered in the Linux shards
  # through injected seams, and the suite at large assumes a POSIX host.
  # Soft: native Windows is a diagnosable host, not a supported sandbox one
  # (docs/user-guide.md, "Platform support"), so this reports rather than
  # blocks. Keep it one job: the workflow's peak is near the 20-concurrent
  # cap on the Free plan (see the pytest job's comment).
  windows-host:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --python 3.13
      - run: uv run --python 3.13 pytest -m windows_host

  test:
    needs: pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-packages --python ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-${{ matrix.python-version }}-*
          merge-multiple: true
      - run: uv run --python ${{ matrix.python-version }} coverage combine .coverage.*
      - run: uv run --python ${{ matrix.python-version }} coverage report --show-missing --fail-under=85

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # hatch-vcs needs tags to resolve the version
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv build --package sbxloop-worker -o dist
      - run: uv build --package sbxloop -o dist
      - name: Assert worker wheel is vendored inside the host wheel
        run: |
          unzip -l dist/sbxloop-*.whl | grep 'sbxloop/_vendor/sbxloop_worker-.*\.whl'
      - name: List artifacts
        run: ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
